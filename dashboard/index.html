<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 생성 플랫폼 관심도 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e4e4e0;
    --accent: #2f6fd0; --up: #1a7f37; --down: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416; --panel: #1d1d20; --ink: #ededee; --muted: #9a9aa2; --line: #2e2e33;
      --accent: #6aa2ff; --up: #4ac26b; --down: #ff7b72;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141416; --panel: #1d1d20; --ink: #ededee; --muted: #9a9aa2; --line: #2e2e33;
    --accent: #6aa2ff; --up: #4ac26b; --down: #ff7b72;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .controls { display: grid; gap: 14px 24px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-bottom: 16px; }
  .ctl label.h { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  input[type=date], select { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px;
                             background: var(--bg); color: var(--ink); }
  button.chip { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px; cursor: pointer;
                border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  button.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .plats { display: flex; flex-wrap: wrap; gap: 6px; }
  .plat { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px;
          border: 1px solid var(--line); border-radius: 999px; cursor: pointer; user-select: none; }
  .plat input { display: none; }
  .plat .dot { width: 10px; height: 10px; border-radius: 50%; }
  .plat:has(input:not(:checked)) { opacity: 0.4; }
  .chart-wrap { position: relative; height: 420px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 16px; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .up { color: var(--up); } .down { color: var(--down); }
  .table-scroll { overflow-x: auto; }
  .note { color: var(--muted); font-size: 12px; margin-top: 12px; }
  .topbar { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
  @media (max-width: 600px) { .chart-wrap { height: 300px; } h1 { font-size: 19px; } }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div>
      <h1>AI 이미지·영상 생성 플랫폼 관심도</h1>
      <p class="sub">위키백과(영문) 일별 조회수 · 사람 트래픽만 · <span id="range-label"></span></p>
    </div>
    <button class="chip" id="theme" aria-label="다크 모드 전환">🌓</button>
  </div>

  <section class="panel controls" aria-label="필터">
    <div class="ctl">
      <label class="h">기간</label>
      <div class="row">
        <input type="date" id="from"> ~ <input type="date" id="to">
      </div>
      <div class="row" style="margin-top:6px" id="presets">
        <button class="chip" data-days="90">90일</button>
        <button class="chip" data-days="365">1년</button>
        <button class="chip" data-days="730">2년</button>
        <button class="chip" data-days="0">전체</button>
      </div>
    </div>
    <div class="ctl">
      <label class="h" for="ma">이동평균</label>
      <select id="ma">
        <option value="1">없음 (일별)</option>
        <option value="7">7일</option>
        <option value="28" selected>28일</option>
      </select>
      <label class="h" style="margin-top:10px">세로축</label>
      <div class="row" id="scale">
        <button class="chip" data-scale="logarithmic" aria-pressed="true">로그</button>
        <button class="chip" data-scale="linear">선형</button>
        <button class="chip" data-scale="share">이미지/영상 비중</button>
      </div>
    </div>
    <div class="ctl" style="grid-column: 1 / -1">
      <label class="h">플랫폼</label>
      <div class="plats" id="plats"></div>
    </div>
  </section>

  <section class="panel">
    <div class="chart-wrap"><canvas id="chart" aria-label="조회수 추이 그래프"></canvas></div>
    <div class="table-scroll">
      <table id="tbl" aria-label="선택 기간 요약">
        <thead><tr><th>플랫폼</th><th>하루 평균</th><th>최대 (날짜)</th><th>기간 첫 30일 → 마지막 30일</th><th>스파이크 일수</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <p class="note">스파이크 = 직전 28일 중앙값 대비 robust z ≥ 5 인 날. 문서가 자리 잡기 전(하루 20회 미만) 구간은 비워 두었습니다. 데이터: Wikimedia Pageviews API (src/analyze.py 가 생성).</p>
  </section>
</main>

<script>
(async function () {
  const root = document.documentElement;
  const themeBtn = document.getElementById("theme");
  try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (e) {}
  themeBtn.onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    render();
  };

  let data;
  try {
    data = await (await fetch("data.json")).json();
  } catch (e) {
    document.querySelector("main").insertAdjacentHTML("beforeend",
      '<p class="panel">data.json 을 읽지 못했습니다. <code>python src/analyze.py</code> 실행 후 <code>python -m http.server -d dashboard</code> 로 열어 주세요.</p>');
    return;
  }
  const dates = data.dates, names = Object.keys(data.platforms);
  const $from = document.getElementById("from"), $to = document.getElementById("to"), $ma = document.getElementById("ma");
  $from.min = $to.min = dates[0]; $from.max = $to.max = dates[dates.length - 1];
  $to.value = dates[dates.length - 1];
  $from.value = dates[Math.max(0, dates.length - 730)];

  const plats = document.getElementById("plats");
  names.forEach(n => {
    const p = data.platforms[n];
    plats.insertAdjacentHTML("beforeend",
      `<label class="plat"><input type="checkbox" value="${n}" checked><span class="dot" style="background:${p.color}"></span>${n} <small style="color:var(--muted)">${p.kind === "image" ? "이미지" : "영상"}</small></label>`);
  });
  let scale = "logarithmic";

  const css = v => getComputedStyle(root).getPropertyValue(v).trim();
  const fmt = n => n == null || isNaN(n) ? "–" : Math.round(n).toLocaleString("ko-KR");

  function movingAvg(arr, w) {
    if (w <= 1) return arr.slice();
    const out = new Array(arr.length).fill(null);
    for (let i = 0; i < arr.length; i++) {
      let s = 0, c = 0;
      for (let j = Math.max(0, i - w + 1); j <= i; j++) if (arr[j] != null) { s += arr[j]; c++; }
      out[i] = c >= Math.ceil(w / 2) && arr[i] != null ? s / c : null;
    }
    return out;
  }
  const mean = a => { const v = a.filter(x => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : NaN; };

  let chart;
  function render() {
    const i0 = Math.max(0, dates.indexOf($from.value)), i1 = dates.indexOf($to.value);
    const end = i1 < 0 ? dates.length - 1 : i1;
    const labels = dates.slice(i0, end + 1);
    const sel = [...plats.querySelectorAll("input:checked")].map(x => x.value);
    const w = +$ma.value;
    document.getElementById("range-label").textContent = `${labels[0]} ~ ${labels[labels.length - 1]} (${labels.length}일)`;

    let datasets;
    if (scale === "share") {
      const sum = kind => labels.map((_, k) => {
        let s = 0, any = false;
        sel.filter(n => data.platforms[n].kind === kind).forEach(n => { const v = data.platforms[n].views[i0 + k]; if (v != null) { s += v; any = true; } });
        return any ? s : null;  // 그 분류의 문서가 아직 없던 날 = 측정 불가 (0%가 아님)
      });
      const img = movingAvg(sum("image"), w), vid = movingAvg(sum("video"), w);
      const share = img.map((v, k) => v == null || vid[k] == null || v + vid[k] === 0 ? null : vid[k] / (v + vid[k]) * 100);
      // movingAvg는 결측이 섞이면 null을 돌려주므로, 영상 문서가 생기기 전 구간은 선이 그려지지 않는다.
      datasets = [{ label: "영상 비중 (%)", data: share, borderColor: "#e0661b", backgroundColor: "rgba(224,102,27,.15)", fill: "origin", pointRadius: 0, borderWidth: 2 }];
    } else {
      datasets = sel.map(n => {
        const p = data.platforms[n];
        return { label: n, data: movingAvg(p.views, w).slice(i0, end + 1), borderColor: p.color, backgroundColor: p.color,
                 pointRadius: 0, borderWidth: 1.8, spanGaps: false, tension: 0.15 };
      });
    }

    const grid = css("--line"), ink = css("--muted");
    const opts = {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { color: ink, boxWidth: 12 } },
                 tooltip: { callbacks: { label: c => `${c.dataset.label}: ${scale === "share" ? c.parsed.y?.toFixed(1) + "%" : fmt(c.parsed.y)}` } } },
      scales: {
        x: { ticks: { color: ink, maxTicksLimit: 8, maxRotation: 0 }, grid: { color: grid } },
        y: { type: scale === "share" ? "linear" : scale, min: scale === "share" ? 0 : undefined, max: scale === "share" ? 100 : undefined,
             ticks: { color: ink, callback: v => scale === "share" ? v + "%" : (Number.isInteger(Math.log10(v)) || scale === "linear" ? fmt(v) : "") },
             grid: { color: grid } }
      }
    };
    if (chart) chart.destroy();
    chart = new Chart(document.getElementById("chart"), { type: "line", data: { labels, datasets }, options: opts });

    const tb = document.querySelector("#tbl tbody");
    tb.innerHTML = sel.map(n => {
      const p = data.platforms[n];
      const v = p.views.slice(i0, end + 1), sp = p.spikes.slice(i0, end + 1);
      const valid = v.map((x, k) => [x, k]).filter(([x]) => x != null);
      if (!valid.length) return `<tr><td>${n}</td><td colspan="4" style="text-align:left;color:var(--muted)">이 기간엔 데이터 없음</td></tr>`;
      const [mx, mk] = valid.reduce((a, b) => b[0] > a[0] ? b : a);
      const first = mean(valid.slice(0, 30).map(x => x[0])), last = mean(valid.slice(-30).map(x => x[0]));
      const chg = (last / first - 1) * 100;
      const cls = chg > 0 ? "up" : "down";
      return `<tr><td><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${p.color};margin-right:6px"></span>${n}</td>
        <td>${fmt(mean(v))}</td><td>${fmt(mx)} <small style="color:var(--muted)">(${labels[mk]})</small></td>
        <td>${fmt(first)} → ${fmt(last)} <b class="${cls}">${isFinite(chg) ? (chg > 0 ? "+" : "") + chg.toFixed(0) + "%" : ""}</b></td>
        <td>${sp.filter(Boolean).length}</td></tr>`;
    }).join("");
  }

  [$from, $to, $ma].forEach(el => el.addEventListener("change", render));
  plats.addEventListener("change", render);
  document.getElementById("presets").addEventListener("click", e => {
    const d = e.target.dataset.days; if (d === undefined) return;
    $to.value = dates[dates.length - 1];
    $from.value = +d === 0 ? dates[0] : dates[Math.max(0, dates.length - +d)];
    render();
  });
  document.getElementById("scale").addEventListener("click", e => {
    const s = e.target.dataset.scale; if (!s) return;
    scale = s;
    [...e.currentTarget.children].forEach(b => b.setAttribute("aria-pressed", b.dataset.scale === s));
    render();
  });
  render();
})();
</script>
</body>
</html>
